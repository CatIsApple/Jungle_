<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --quote: #f6f8fa;
        --link: #0969da;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0d1117;
          --foreground: #f0f6fc;
          --muted: #9198a1;
          --border: #3d444d;
          --quote: #151b23;
          --link: #4493f8;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.75;
      }

      main {
        width: min(100% - 40px, 860px);
        margin: 0 auto;
        padding: 64px 0 96px;
      }

      h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 44px); line-height: 1.25; }
      h2 { margin-top: 52px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
      p { margin: 16px 0; }
      sub { color: var(--muted); }
      img { display: block; width: 100%; height: auto; margin: 28px 0; border-radius: 10px; }
      a { color: var(--link); }
      code { padding: 2px 6px; border-radius: 6px; background: var(--quote); }
      blockquote { margin: 24px 0; padding: 12px 18px; background: var(--quote); border-left: 4px solid var(--border); }
      blockquote p { margin: 0; }
      table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
      th, td { padding: 10px 12px; border: 1px solid var(--border); text-align: left; white-space: nowrap; }
      th { background: var(--quote); }
      hr { margin: 44px 0; border: 0; border-top: 1px solid var(--border); }

      @media (max-width: 600px) {
        main { width: min(100% - 28px, 860px); padding-top: 36px; }
        body { font-size: 15px; }
        h2 { margin-top: 40px; }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
